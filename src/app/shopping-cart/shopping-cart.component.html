<div class="shop-items">
  <div class="shop-item" *ngFor="let item of shopItems">
    <span class="shop-item-title">
      {{ item.title }}
    </span>

    <span class="shop-item-price"> ${{ item.price.toFixed(2) }} </span>

    <img
      class="shop-item-image"
      [src]="item.imageSrc"
      [alt]="item.title"
      width="100"
      height="100"
    />

    <button class="shop-item-button" type="button" (click)="addToCart(item)">
      ADD TO CART
    </button>
  </div>
</div>

<div class="cart-items">
  <div class="cart-row" *ngFor="let item of cartItems; let i = index">
    <div class="cart-item cart-column">
      <img
        class="cart-item-image"
        [src]="item.imageSrc"
        [alt]="item.title"
        width="100"
        height="100"
      />

      <span class="cart-item-title">
        {{ item.title }}
      </span>
    </div>

    <span class="cart-price cart-column"> ${{ item.price.toFixed(2) }} </span>

    <div class="cart-quantity cart-column">
      <input
        class="cart-quantity-input"
        type="number"
        [value]="item.quantity"
        (change)="quantityChanged($event, item)"
      />

      <button class="btn btn-danger" type="button" (click)="removeCartItem(i)">
        REMOVE
      </button>
    </div>
  </div>
</div>

<div class="cart-total">
  <strong> Total: </strong>

  <span class="cart-total-price"> ${{ cartTotal.toFixed(2) }} </span>
</div>

<button class="btn-purchase" type="button" (click)="purchaseClicked()">
  PURCHASE
</button>
